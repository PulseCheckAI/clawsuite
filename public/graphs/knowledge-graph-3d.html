<style>
:root{--navy:#070a11;--surface:#0d131d;--light:#eef2f7;--mid:#8b97a8;--cyan:#00e5ff;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--light);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
.label{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.01em;color:#fff;text-shadow:0 1px 6px #000,0 0 12px rgba(0,229,255,.25);pointer-events:none;white-space:nowrap;opacity:.92}
/* liquid-glass control panel (iOS 26 language, web translation) */
.panel{position:fixed;top:16px;left:16px;width:296px;max-height:calc(100vh - 32px);overflow-y:auto;

  border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:22px;

.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--cyan);text-decoration:none;margin-bottom:14px;padding:7px 13px;border-radius:999px;background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.25);transition:background .2s,transform .2s}
.back:hover{background:rgba(0,229,255,.20);transform:translateX(-2px)}
.panel h1{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.panel .sub{color:var(--mid);font-size:12px;line-height:1.55;margin-bottom:22px}
.sec{margin-bottom:22px}
.sec h3{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#cdd6e2;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.seed-input{width:100%;background:rgba(255,255,255,.05);color:#fff;padding:10px;border-radius:10px;font-family:var(--mono);font-size:14px;text-align:center;border:1px solid rgba(255,255,255,.10);margin-bottom:9px;outline:none}
.seed-input:focus{border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cg{margin-bottom:14px}.cg label{display:block;font-size:12px;color:#aeb8c6;margin-bottom:7px}
.sl{display:flex;align-items:center;gap:10px}
.sl input[type=range]{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;-webkit-appearance:none;outline:none}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--cyan);border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.6)}
.val{font-family:var(--mono);font-size:11px;color:var(--mid);min-width:40px;text-align:right}
.btn{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);padding:10px 12px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;width:100%;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(0,229,255,.40);transform:translateY(-1px)}
.btn.b{background:rgba(0,229,255,.14);border:1px solid rgba(0,229,255,.35);color:#bff5ff}.btn.b:hover{background:rgba(0,229,255,.24)}
.btn.g{background:var(--pulse);border:none;color:#fff;font-weight:600}.btn.g:hover{filter:brightness(1.08)}
.legend{font-size:11.5px;color:var(--mid);line-height:1.9}.legend .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.cgrp{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px;color:var(--mid);font-family:var(--mono)}
.cgrp input[type=color]{width:28px;height:28px;border:none;border-radius:8px;background:none;padding:0;cursor:pointer}
.hint{position:fixed;bottom:14px;right:16px;font-size:11px;color:var(--mid);font-family:var(--mono);background:rgba(13,19,29,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:#aeb8c6;cursor:pointer}.toggle input{accent-color:var(--cyan)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:rgba(255,255,255,.06);color:#aeb8c6;border:1px solid rgba(255,255,255,.12);padding:8px 4px;border-radius:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button.active{background:rgba(0,229,255,.16);border-color:rgba(0,229,255,.45);color:#bff5ff}
</style></head>

<div id="scene"></div>
<div class="hint" id="hud">drag to orbit · scroll to zoom</div>
<div class="panel">
  <h1>Knowledge Graph 3D</h1>
  <div class="sub">PulseCheck OS — the LightRAG entity graph in space. Particles stream along real relationships. 181 nodes · 165 edges · 2026-05-21 13:48</div>
  <div class="sec"><h3>Seed</h3>
    <input id="seed" class="seed-input" type="number" value="12345" onchange="setSeed()">
    <div class="row2"><button class="btn b" onclick="seedDelta(-1)">&larr; Prev</button><button class="btn b" onclick="seedDelta(1)">Next &rarr;</button></div>
    <button class="btn g" onclick="seedRand()">&#8635; Random</button>
  </div>
  <div class="sec"><h3>Layout & Flow</h3>
    <div class="cg"><label>Link distance</label><div class="sl"><input type="range" id="linkDist" min="8" max="50" step="1" value="18" oninput="setP('linkDist',this.value,0)"><span class="val" id="linkDist-v">18</span></div></div>
    <div class="cg"><label>Repulsion</label><div class="sl"><input type="range" id="repulsion" min="0.3" max="3" step="0.1" value="1" oninput="setP('repulsion',this.value,1)"><span class="val" id="repulsion-v">1.0</span></div></div>
    <div class="cg"><label>Flow speed</label><div class="sl"><input type="range" id="flowSpeed" min="0.1" max="3" step="0.1" value="1" oninput="setP('flowSpeed',this.value,1)"><span class="val" id="flowSpeed-v">1.0</span></div></div>
    <div class="cg"><label>Node scale</label><div class="sl"><input type="range" id="nodeScale" min="0.4" max="3" step="0.1" value="1" oninput="setNodeScale(this.value)"><span class="val" id="nodeScale-v">1.0</span></div></div>
    <div class="cg"><label>Glow (bloom)</label><div class="sl"><input type="range" id="bloom" min="0" max="2.5" step="0.1" value="1.1" oninput="setBloom(this.value)"><span class="val" id="bloom-v">1.1</span></div></div>
    <label class="toggle"><input type="checkbox" id="autorot" checked onchange="params.autorot=this.checked"> auto-rotate</label>
  </div>
  <div class="sec"><h3>Labels</h3>
    <div class="seg" id="labelSeg">
      <button data-m="all" onclick="setLabelMode('all')">All</button>
      <button data-m="important" class="active" onclick="setLabelMode('important')">Important</button>
      <button data-m="hover" onclick="setLabelMode('hover')">Hover</button>
      <button data-m="none" onclick="setLabelMode('none')">None</button>
    </div>
  </div>
  <div class="sec"><h3>Particle palette</h3>
    <div class="cgrp"><input type="color" id="c0" value="#00e5ff" onchange="setColor(0,this.value)"><span id="c0-v">#00e5ff</span></div>
    <div class="cgrp"><input type="color" id="c1" value="#ff6b35" onchange="setColor(1,this.value)"><span id="c1-v">#ff6b35</span></div>
    <div class="cgrp"><input type="color" id="c2" value="#ffd166" onchange="setColor(2,this.value)"><span id="c2-v">#ffd166</span></div>
  </div>
  <div class="sec"><h3>Node types</h3><div class="legend" id="legend"></div></div>
  <div class="sec"><div class="row2"><button class="btn" onclick="rebuild()">Reset layout</button><button class="btn b" onclick="snap()">Save PNG</button></div></div>
</div>

function updateParticles(){const p=points.geometry.attributes.position.array;for(let i=0;i<particleMeta.length;i++){const m=particleMeta[i],a=nodes[m.e.a].mesh.position,b=nodes[m.e.b].mesh.position;m.t+=0.006*params.flowSpeed*(0.5+m.e.w*0.5);if(m.t>1)m.t-=1;p[i*3]=a.x+(b.x-a.x)*m.t;p[i*3+1]=a.y+(b.y-a.y)*m.t;p[i*3+2]=a.z+(b.z-a.z)*m.t}points.geometry.attributes.position.needsUpdate=true}

renderer.setAnimationLoop(()=>{
  if(settle<300){for(let s2=0;s2<2;s2++)step();settle++}else step();
  updateEdgeLines();updateParticles();updateHover();
  if(params.autorot)group.rotation.y+=0.0009;
  if(lineSeg)lineSeg.rotation.y=group.rotation.y;if(points)points.rotation.y=group.rotation.y;
  controls.update();composer.render();labelRenderer.render(scene,camera);
  document.getElementById('hud').textContent=`seed ${params.seed} · ${nodes.length} nodes · ${edges.length} edges · drag to orbit · scroll to zoom`;
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

// controls
window.setP=(k,v,dp)=>{params[k]=parseFloat(v);document.getElementById(k+'-v').textContent=(+v).toFixed(dp)};
window.setNodeScale=(v)=>{params.nodeScale=parseFloat(v);document.getElementById('nodeScale-v').textContent=(+v).toFixed(1);nodes.forEach((n)=>{n.r=(4.5+Math.sqrt(n.deg)*3.4)*params.nodeScale;n.mesh.scale.setScalar(n.r);if(n.label)n.label.position.set(0,(n.r+5)/n.r,0)})};
window.setBloom=(v)=>{params.bloom=parseFloat(v);bloom.strength=params.bloom;document.getElementById('bloom-v').textContent=(+v).toFixed(1)};
window.setColor=(i,v)=>{params.palette[i]=v;document.getElementById('c'+i+'-v').textContent=v;build()};
window.setSeed=()=>{const v=parseInt(document.getElementById('seed').value);if(v>0){params.seed=v;build()}};
window.seedDelta=(d)=>{params.seed=Math.max(1,params.seed+d);document.getElementById('seed').value=params.seed;build()};
window.seedRand=()=>{params.seed=Math.floor(Math.random()*999999)+1;document.getElementById('seed').value=params.seed;build()};
window.rebuild=()=>build();
window.setLabelMode=(m)=>{params.labelMode=m;nodes.forEach(n=>{if(n.label)n.label.visible=labelVisible(n)});document.querySelectorAll('#labelSeg button').forEach(b=>b.classList.toggle('active',b.dataset.m===m))};
window.snap=()=>{composer.render();const a=document.createElement('a');a.download='pulsecheck-knowledge-graph-3d-'+params.seed+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};

build();
</script></body></html>
